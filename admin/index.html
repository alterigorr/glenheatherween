<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Glenheatherween admin</title>
<link rel="icon" href="../icon.svg?v=2026" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<script src="../defaults.js?v=2026b"></script>
<style>
  :root {
    --bg: #FBF6EE; --surface: #FFFFFF; --ink: #1F1A17; --muted: #5E554D; --line: #E4D8C9;
    --accent: #C2410C; --accent-hover: #A93A0B; --accent-soft: #FDE7D6; --danger: #B91C1C; --ok: #166534; --ok-soft: #DCFCE7;
    --focus: #1D4ED8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 18px/1.55 'Atkinson Hyperlegible', system-ui, sans-serif; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 800; line-height: 1.15; margin: 0; }
  h1 { font-size: 2rem; }
  h1 span { color: var(--accent); }
  h2 { font-size: 1.35rem; margin-bottom: 4px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-top: 20px; display: grid; gap: 16px; }
  .field { display: grid; gap: 6px; }
  label, .label { font-weight: 700; }
  label small, .label small { display: block; font-weight: 400; color: var(--muted); font-size: .9rem; }
  input[type="text"], input[type="password"], input[type="date"], textarea {
    width: 100%; min-height: 52px; padding: 10px 14px; font: 400 1.05rem 'Atkinson Hyperlegible', sans-serif;
    color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--accent); outline: none; }
  .row2 { display: grid; grid-template-columns: 9.5em 1fr auto; gap: 10px; align-items: end; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 22px;
    border: 2px solid transparent; border-radius: 14px; font: 700 1rem 'Atkinson Hyperlegible', sans-serif; cursor: pointer; text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-icon { min-height: 52px; padding: 8px 14px; }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .toggle { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--bg); }
  .toggle:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .toggle input { width: 26px; height: 26px; accent-color: var(--accent); margin: 0; }
  .preview { padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); font-weight: 700; }
  .msg { padding: 12px 16px; border-radius: 12px; font-weight: 700; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }
  .msg.err { background: #FEE2E2; color: var(--danger); }
  .raffle-fields { display: grid; gap: 16px; }
  .raffle-fields[disabled] { opacity: .5; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } .row2 .btn-icon { justify-self: start; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <h1>Glenheather<span>ween</span> admin</h1>
    <button class="btn btn-secondary hidden" type="button" id="lockBtn">🔒 Lock</button>
  </div>

  <!-- PIN -->
  <form class="card" id="pinForm" autocomplete="off">
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" required>
    </div>
    <p class="msg err hidden" id="pinMsg" role="alert"></p>
    <button class="btn btn-primary" type="submit" id="pinBtn">Unlock</button>
  </form>

  <!-- Settings -->
  <form class="hidden" id="settingsForm" novalidate>
    <section class="card" aria-labelledby="whenTitle">
      <h2 id="whenTitle">When</h2>
      <div class="field">
        <label for="eventDate">Event date <small>The year on the site and flyer follows this date</small></label>
        <input id="eventDate" type="date" required>
      </div>
      <p class="preview" id="datePreview" aria-live="polite"></p>
      <div class="field">
        <span class="label">Times <small>Shown under the date, top to bottom. Up to 3.</small></span>
        <div id="hoursList" style="display:grid;gap:12px"></div>
        <div><button class="btn btn-secondary" type="button" id="addHour">＋ Add a time</button></div>
      </div>
    </section>

    <section class="card" aria-labelledby="raffleTitle">
      <h2 id="raffleTitle">50/50 raffle</h2>
      <label class="toggle"><input type="checkbox" id="raffleOn"> <span>Show the raffle on the site and flyer</span></label>
      <fieldset class="raffle-fields" id="raffleFields">
        <div class="field"><label for="rIntro">Description <small>Shown on the site (the flyer keeps it short)</small></label><textarea id="rIntro" maxlength="200"></textarea></div>
        <div class="field"><label for="rLocation">Where to buy tickets</label><input id="rLocation" type="text" maxlength="80"></div>
        <div class="field"><label for="rPrice">Price</label><input id="rPrice" type="text" maxlength="80"></div>
        <div class="field"><label for="rPay">Pay with</label><input id="rPay" type="text" maxlength="60"></div>
        <div class="field"><label for="rDrawing">Drawing</label><input id="rDrawing" type="text" maxlength="80"></div>
      </fieldset>
    </section>

    <section class="card">
      <p class="msg hidden" id="saveMsg" role="status"></p>
      <div class="btn-row">
        <button class="btn btn-primary" type="submit" id="saveBtn">Save changes</button>
        <a class="btn btn-secondary" href="../" target="_blank" rel="noopener">View the site</a>
        <a class="btn btn-secondary" href="../?flyer" target="_blank" rel="noopener">View the flyer</a>
      </div>
      <p class="muted">The site and on-screen flyer update right away. The printable PDF follows a couple of minutes later.</p>
    </section>
  </form>
</main>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx7zk15RRbM5bWB5mWUGVJjfmNwpsks1nF69mWLuvyDJf7K__MU4dmfxblRFgqs-182/exec';
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
let pin = '';
let rowId = 0;

// Same approach as the main site: plain-text POST, and a receipt check if the reply can't be read.
async function post(payload) {
  const rid = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`).replace(/[^a-z0-9-]/gi, '');
  const body = JSON.stringify({ ...payload, rid });
  try {
    const r = await fetch(SHEET_URL, { method: 'POST', body });
    return await r.json();
  } catch (e) {
    for (let i = 0; i < 5; i++) {
      await wait(1500);
      try {
        const b = await (await fetch(`${SHEET_URL}?rid=${encodeURIComponent(rid)}`, { cache: 'no-store' })).json();
        if (b.done) return b;
      } catch (e2) { /* try again */ }
    }
    return { ok: false, error: "Couldn't reach the server. Check your connection and try again." };
  }
}

function show(el, text, kind) {
  el.textContent = text;
  el.className = `msg ${kind}`;
}

/* ---- Times rows ---- */
function hourRow(when = '', what = '') {
  const row = document.createElement('div');
  row.className = 'row2';
  const n = ++rowId;
  row.innerHTML = `
    <div class="field"><label>Time</label><input type="text" class="h-when" maxlength="30" placeholder="4 – 6 PM"></div>
    <div class="field"><label>For</label><input type="text" class="h-what" maxlength="60" placeholder="Glen Heather residents"></div>
    <button class="btn btn-secondary btn-icon" type="button" aria-label="Remove this time">Remove</button>`;
  row.querySelector('.h-when').value = when;
  row.querySelector('.h-what').value = what;
  row.querySelectorAll('label').forEach((l, i) => { const id = `h${n}-${i}`; l.htmlFor = id; l.nextElementSibling.id = id; });
  row.querySelector('button').addEventListener('click', () => { row.remove(); syncHours(); $('#addHour').focus(); });
  $('#hoursList').append(row);
  syncHours();
}
function syncHours() {
  const n = $('#hoursList').children.length;
  $('#addHour').classList.toggle('hidden', n >= 3);
  $('#hoursList').querySelectorAll('.btn-icon').forEach(b => b.classList.toggle('hidden', n <= 1));
}

/* ---- Form <-> settings ---- */
function fill(s) {
  $('#eventDate').value = s.eventDate;
  $('#hoursList').replaceChildren();
  (s.hours || []).forEach(r => hourRow(r.when, r.what));
  if (!$('#hoursList').children.length) hourRow();
  const r = s.raffle || {};
  $('#raffleOn').checked = !!r.enabled;
  $('#rIntro').value = r.intro || '';
  $('#rLocation').value = r.location || '';
  $('#rPrice').value = r.price || '';
  $('#rPay').value = r.pay || '';
  $('#rDrawing').value = r.drawing || '';
  syncRaffle();
  syncDate();
}

function read() {
  return {
    eventDate: $('#eventDate').value,
    hours: [...$('#hoursList').children].map(row => ({ when: row.querySelector('.h-when').value.trim(), what: row.querySelector('.h-what').value.trim() }))
      .filter(r => r.when || r.what),
    raffle: {
      enabled: $('#raffleOn').checked,
      intro: $('#rIntro').value.trim(), location: $('#rLocation').value.trim(),
      price: $('#rPrice').value.trim(), pay: $('#rPay').value.trim(), drawing: $('#rDrawing').value.trim()
    }
  };
}

function syncDate() {
  const v = $('#eventDate').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { $('#datePreview').textContent = 'Choose a date'; return; }
  const [y, m, d] = v.split('-').map(Number);
  const long = new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  $('#datePreview').textContent = `Shows as: ${long} · Glenheatherween ${y}`;
}
function syncRaffle() {
  $('#raffleFields').disabled = !$('#raffleOn').checked;
}

/* ---- Unlock ---- */
async function unlock(candidate, quiet) {
  $('#pinBtn').disabled = true; $('#pinBtn').textContent = 'Checking…';
  const res = await post({ type: 'admin-check', pin: candidate });
  $('#pinBtn').disabled = false; $('#pinBtn').textContent = 'Unlock';
  if (!res.ok) {
    try { sessionStorage.removeItem('ghw-pin'); } catch (e) {}
    if (!quiet) { show($('#pinMsg'), res.error || "That PIN isn't right.", 'err'); $('#pin').value = ''; $('#pin').focus(); }
    return;
  }
  pin = candidate;
  try { sessionStorage.setItem('ghw-pin', pin); } catch (e) {}
  fill(res.settings || window.GHW_DEFAULTS);
  $('#pinForm').classList.add('hidden');
  $('#settingsForm').classList.remove('hidden');
  $('#lockBtn').classList.remove('hidden');
}

$('#pinForm').addEventListener('submit', ev => {
  ev.preventDefault();
  $('#pinMsg').classList.add('hidden');
  const v = $('#pin').value.trim();
  if (!v) return show($('#pinMsg'), 'Enter the PIN.', 'err');
  unlock(v);
});

$('#lockBtn').addEventListener('click', () => {
  pin = '';
  try { sessionStorage.removeItem('ghw-pin'); } catch (e) {}
  $('#settingsForm').classList.add('hidden');
  $('#lockBtn').classList.add('hidden');
  $('#pinForm').classList.remove('hidden');
  $('#pin').value = '';
  $('#saveMsg').classList.add('hidden');
});

/* ---- Save ---- */
$('#settingsForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = $('#saveMsg');
  const data = read();
  if (!data.eventDate) return show(msg, 'Choose the event date.', 'err');
  if (!data.hours.length) return show(msg, 'Add at least one time.', 'err');
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const res = await post({ type: 'settings', pin, data });
  btn.disabled = false; btn.textContent = 'Save changes';
  if (res.ok) {
    fill(res.settings);
    show(msg, res.flyerRebuilding
      ? 'Saved. The site shows your changes now, and the printable flyer updates in about 2 minutes.'
      : 'Saved. The site shows your changes now. The printable flyer catches up within about 15 minutes.', 'ok');
  } else {
    show(msg, res.error || "That didn't save. Try again.", 'err');
    if (res.badPin || res.locked) $('#lockBtn').click();
  }
});

$('#addHour').addEventListener('click', () => { hourRow(); $('#hoursList').lastElementChild.querySelector('input').focus(); });
$('#eventDate').addEventListener('input', syncDate);
$('#raffleOn').addEventListener('change', syncRaffle);

// Stay unlocked for this browser tab's session.
try { const saved = sessionStorage.getItem('ghw-pin'); if (saved) unlock(saved, true); } catch (e) {}
</script>
</body>
</html>
